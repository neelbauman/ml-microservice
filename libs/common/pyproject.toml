[project]
name = "ml-pipeline-common"
version = "0.1.0"
description = "Shared utilities for ML pipeline services"
requires-python = ">=3.12"
dependencies = [
    "dapr>=1.14.0",
    "dapr-ext-fastapi>=1.14.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
