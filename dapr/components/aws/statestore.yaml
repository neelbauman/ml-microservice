apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "${ELASTICACHE_ENDPOINT}"
    - name: redisPassword
      secretKeyRef:
        name: elasticache-credentials
        key: password
    - name: enableTLS
      value: "true"
    - name: actorStateStore
      value: "true"
    - name: keyPrefix
      value: "ml-pipeline"
