[project]
name = "dashboard-svc"
version = "0.1.0"
description = "Real-time dashboard for ML pipeline data and inference results"
requires-python = ">=3.12"
dependencies = [
    "ml-pipeline-common",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

[tool.uv.sources]
ml-pipeline-common = { workspace = true }
