<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#2980B9"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#7D3C98"/>
    </marker>
    <marker id="ah-orange" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#D35400"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#C0392B"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#7F8C8D"/>
    </marker>
    <filter id="drop" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="700" fill="#F7F9FB" rx="4"/>

  <!-- Title -->
  <text x="640" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2631">ML Pipeline &#8212; Microservice Topology</text>
  <text x="640" y="60" text-anchor="middle" font-size="12" fill="#808B96">Dapr Pub/Sub Event-Driven Architecture</text>

  <!-- =============== SERVICES =============== -->
  <text x="70" y="100" font-size="11" font-weight="700" fill="#ABB2B9" letter-spacing="2.5">SERVICES</text>
  <line x1="70" y1="108" x2="1210" y2="108" stroke="#E5E8E8" stroke-width="1"/>

  <!-- Ingestion -->
  <g filter="url(#drop)">
    <rect x="70" y="248" width="180" height="65" rx="10" fill="#3498DB"/>
  </g>
  <text x="160" y="278" text-anchor="middle" font-size="16" font-weight="600" fill="#FFF">Ingestion</text>
  <text x="160" y="300" text-anchor="middle" font-size="10" fill="#D6EAF8" opacity="0.85">pub: raw-data</text>

  <!-- Preprocessing -->
  <g filter="url(#drop)">
    <rect x="350" y="248" width="180" height="65" rx="10" fill="#8E44AD"/>
  </g>
  <text x="440" y="278" text-anchor="middle" font-size="16" font-weight="600" fill="#FFF">Preprocessing</text>
  <text x="440" y="300" text-anchor="middle" font-size="10" fill="#E8DAEF" opacity="0.85">pub: preprocessed-data</text>

  <!-- Inference -->
  <g filter="url(#drop)">
    <rect x="630" y="248" width="180" height="65" rx="10" fill="#E67E22"/>
  </g>
  <text x="720" y="278" text-anchor="middle" font-size="16" font-weight="600" fill="#FFF">Inference</text>
  <text x="720" y="300" text-anchor="middle" font-size="10" fill="#FDEBD0" opacity="0.85">pub: results + alerts</text>

  <!-- Dashboard -->
  <g filter="url(#drop)">
    <rect x="985" y="128" width="190" height="65" rx="10" fill="#27AE60"/>
  </g>
  <text x="1080" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#FFF">Dashboard</text>
  <text x="1080" y="180" text-anchor="middle" font-size="10" fill="#D5F5E3" opacity="0.85">sub: raw-data, results, alerts</text>

  <!-- Alert -->
  <g filter="url(#drop)">
    <rect x="985" y="388" width="190" height="65" rx="10" fill="#C0392B"/>
  </g>
  <text x="1080" y="418" text-anchor="middle" font-size="16" font-weight="600" fill="#FFF">Alert</text>
  <text x="1080" y="440" text-anchor="middle" font-size="10" fill="#F5B7B1" opacity="0.85">sub: alerts</text>

  <!-- =============== PUB/SUB ARROWS =============== -->

  <!-- 1. Ingestion -> Preprocessing : raw-data -->
  <line x1="250" y1="280" x2="345" y2="280" stroke="#2980B9" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <rect x="264" y="263" width="62" height="17" rx="8" fill="#EBF5FB" stroke="#AED6F1" stroke-width="0.8"/>
  <text x="295" y="275" text-anchor="middle" font-size="9.5" fill="#2471A3" font-weight="500">raw-data</text>

  <!-- 2. Preprocessing -> Inference : preprocessed-data -->
  <line x1="530" y1="280" x2="625" y2="280" stroke="#7D3C98" stroke-width="2.5" marker-end="url(#ah-purple)"/>
  <rect x="538" y="263" width="78" height="17" rx="8" fill="#F5EEF8" stroke="#D7BDE2" stroke-width="0.8"/>
  <text x="577" y="275" text-anchor="middle" font-size="9.5" fill="#6C3483" font-weight="500">preprocessed</text>

  <!-- 3. Inference -> Dashboard : inference-results -->
  <path d="M810,260 C875,260 938,150 980,150" fill="none" stroke="#D35400" stroke-width="2.5" marker-end="url(#ah-orange)"/>
  <rect x="860" y="188" width="95" height="17" rx="8" fill="#FEF5E7" stroke="#F5CBA7" stroke-width="0.8"/>
  <text x="907" y="200" text-anchor="middle" font-size="9.5" fill="#D35400" font-weight="500">inference-results</text>

  <!-- 4. Inference -> alerts fan-out (stem) -->
  <line x1="810" y1="290" x2="848" y2="290" stroke="#C0392B" stroke-width="2.5"/>
  <circle cx="850" cy="290" r="4.5" fill="#C0392B"/>

  <!-- 4a. alerts -> Dashboard -->
  <path d="M854,288 C895,282 942,178 980,178" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#ah-red)"/>
  <rect x="907" y="218" width="48" height="17" rx="8" fill="#FDEDEC" stroke="#F5B7B1" stroke-width="0.8"/>
  <text x="931" y="230" text-anchor="middle" font-size="9.5" fill="#C0392B" font-weight="500">alerts</text>

  <!-- 4b. alerts -> Alert -->
  <path d="M854,293 C895,300 942,420 980,420" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <rect x="885" y="370" width="48" height="17" rx="8" fill="#FDEDEC" stroke="#F5B7B1" stroke-width="0.8"/>
  <text x="909" y="382" text-anchor="middle" font-size="9.5" fill="#C0392B" font-weight="500">alerts</text>

  <!-- 5. Ingestion -> Dashboard : raw-data (fan-out, dashed) -->
  <path d="M160,248 C160,85 1080,85 1080,123" fill="none" stroke="#2980B9" stroke-width="1.8" stroke-dasharray="7,4" marker-end="url(#ah-blue)"/>
  <rect x="580" y="72" width="62" height="17" rx="8" fill="#EBF5FB" stroke="#AED6F1" stroke-width="0.8"/>
  <text x="611" y="84" text-anchor="middle" font-size="9.5" fill="#2471A3" font-weight="500">raw-data</text>
  <text x="655" y="84" font-size="9" fill="#ABB2B9" font-style="italic">(fan-out)</text>

  <!-- 6. External -> Inference : model-updates -->
  <line x1="720" y1="185" x2="720" y2="243" stroke="#7F8C8D" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ah-gray)"/>
  <rect x="670" y="158" width="100" height="17" rx="8" fill="#F8F9F9" stroke="#D5D8DC" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="720" y="170" text-anchor="middle" font-size="9.5" fill="#7F8C8D" font-weight="500">model-updates</text>
  <text x="720" y="148" text-anchor="middle" font-size="9" fill="#BDC3C7" font-style="italic">(external)</text>

  <!-- =============== INFRASTRUCTURE =============== -->
  <text x="70" y="520" font-size="11" font-weight="700" fill="#ABB2B9" letter-spacing="2.5">INFRASTRUCTURE</text>
  <line x1="70" y1="528" x2="1210" y2="528" stroke="#E5E8E8" stroke-width="1"/>

  <!-- Redpanda -->
  <g filter="url(#drop)">
    <rect x="70" y="548" width="220" height="48" rx="8" fill="#2C3E50"/>
  </g>
  <text x="180" y="570" text-anchor="middle" font-size="13" font-weight="600" fill="#ECF0F1">Redpanda</text>
  <text x="180" y="586" text-anchor="middle" font-size="10" fill="#7F8C8D">PubSub (Kafka protocol)</text>
  <text x="180" y="612" text-anchor="middle" font-size="9" fill="#ABB2B9">all services</text>

  <!-- Valkey -->
  <g filter="url(#drop)">
    <rect x="330" y="548" width="220" height="48" rx="8" fill="#2C3E50"/>
  </g>
  <text x="440" y="570" text-anchor="middle" font-size="13" font-weight="600" fill="#ECF0F1">Valkey</text>
  <text x="440" y="586" text-anchor="middle" font-size="10" fill="#7F8C8D">Statestore (Redis protocol)</text>
  <text x="440" y="612" text-anchor="middle" font-size="9" fill="#ABB2B9">ingestion, preprocessing, inference, alert</text>

  <!-- MinIO -->
  <g filter="url(#drop)">
    <rect x="590" y="548" width="220" height="48" rx="8" fill="#2C3E50"/>
  </g>
  <text x="700" y="570" text-anchor="middle" font-size="13" font-weight="600" fill="#ECF0F1">MinIO</text>
  <text x="700" y="586" text-anchor="middle" font-size="10" fill="#7F8C8D">Model Store (S3 binding)</text>
  <text x="700" y="612" text-anchor="middle" font-size="9" fill="#ABB2B9">model-store component</text>

  <!-- OTEL Collector -->
  <g filter="url(#drop)">
    <rect x="850" y="548" width="240" height="48" rx="8" fill="#2C3E50"/>
  </g>
  <text x="970" y="570" text-anchor="middle" font-size="13" font-weight="600" fill="#ECF0F1">OTEL Collector</text>
  <text x="970" y="586" text-anchor="middle" font-size="10" fill="#7F8C8D">Distributed Tracing (gRPC:4317)</text>
  <text x="970" y="612" text-anchor="middle" font-size="9" fill="#ABB2B9">all services (sampling: 100%)</text>

  <!-- =============== LEGEND =============== -->
  <text x="70" y="660" font-size="10" font-weight="700" fill="#ABB2B9" letter-spacing="2">LEGEND</text>
  <line x1="70" y1="665" x2="1210" y2="665" stroke="#E5E8E8" stroke-width="0.5"/>

  <!-- Solid arrow = publish/subscribe -->
  <line x1="120" y1="683" x2="158" y2="683" stroke="#5D6D7E" stroke-width="2.5"/>
  <polygon points="158,679 166,683 158,687" fill="#5D6D7E"/>
  <text x="172" y="687" font-size="10" fill="#5D6D7E">Publish / Subscribe</text>

  <!-- Dashed arrow = fan-out -->
  <line x1="320" y1="683" x2="358" y2="683" stroke="#5D6D7E" stroke-width="1.8" stroke-dasharray="7,4"/>
  <polygon points="358,679 366,683 358,687" fill="#5D6D7E"/>
  <text x="372" y="687" font-size="10" fill="#5D6D7E">Fan-out (same topic, multi-subscriber)</text>

  <!-- Fork dot -->
  <circle cx="615" cy="683" r="4" fill="#C0392B"/>
  <text x="625" y="687" font-size="10" fill="#5D6D7E">Topic fan-out point</text>

  <!-- External dashed -->
  <line x1="770" y1="683" x2="808" y2="683" stroke="#7F8C8D" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polygon points="808,679 816,683 808,687" fill="#7F8C8D"/>
  <text x="822" y="687" font-size="10" fill="#5D6D7E">External input</text>

  <!-- Topic pill -->
  <rect x="940" y="674" width="50" height="16" rx="8" fill="#F0F3F4" stroke="#D5D8DC" stroke-width="0.8"/>
  <text x="965" y="685" text-anchor="middle" font-size="9" fill="#5D6D7E">topic</text>
  <text x="1000" y="687" font-size="10" fill="#5D6D7E">Kafka topic name</text>
</svg>
