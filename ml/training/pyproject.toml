[project]
name = "ml-training"
version = "0.1.0"
description = "ML training pipeline"
requires-python = ">=3.12"
dependencies = [
    "ml-pipeline-common",
    "torch>=2.4.0",
    "mlflow>=2.16.0",
    "feast[redis]>=0.40.0",
    "boto3>=1.35.0",
    "scikit-learn>=1.5.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "onnxscript>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training"]

[tool.uv.sources]
ml-pipeline-common = { workspace = true }
