[project]
name = "ml-dapr-pipeline"
version = "0.1.0"
description = "ML inference pipeline with Dapr sidecar pattern"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "source/libs/common",
    "source/services/ingestion",
    "source/services/preprocessing",
    "source/services/inference",
    "source/services/alert",
    "source/ml/training",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "rich>=13.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
