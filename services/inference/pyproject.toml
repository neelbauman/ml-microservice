[project]
name = "inference-svc"
version = "0.1.0"
description = "Model inference service with Dapr sidecar"
requires-python = ">=3.12"
dependencies = [
    "ml-pipeline-common",
    "uvicorn[standard]>=0.30.0",
    "onnxruntime>=1.19.0",
    "numpy>=2.1.0",
    "tritonclient[http]>=2.50.0",
    "mlflow>=2.16.0",
    "boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference"]

[tool.uv.sources]
ml-pipeline-common = { workspace = true }
