[project]
name = "preprocessing-svc"
version = "0.1.0"
description = "Data preprocessing service with Dapr sidecar"
requires-python = ">=3.12"
dependencies = [
    "ml-pipeline-common",
    "uvicorn[standard]>=0.30.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preprocessing"]

[tool.uv.sources]
ml-pipeline-common = { workspace = true }
