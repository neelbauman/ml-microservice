[project]
name = "alert-svc"
version = "0.1.0"
description = "Alert notification service with Dapr sidecar"
requires-python = ">=3.12"
dependencies = [
    "ml-pipeline-common",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alert"]

[tool.uv.sources]
ml-pipeline-common = { workspace = true }
