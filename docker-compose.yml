
x-dapr-env: &dapr-env
  DAPR_HTTP_PORT: "3500"
  DAPR_GRPC_PORT: "50001"

services:
  # ============================================================
  # Infrastructure
  # ============================================================
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --default-log-level=warn
      - --advertise-kafka-addr redpanda:9092
    ports:
      - "19092:9092"
      - "18081:8081"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/mlflow-artifacts &&
      mc mb --ignore-existing local/ml-models &&
      mc mb --ignore-existing local/ml-data &&
      echo 'Buckets created'
      "

  # ============================================================
  # ML Platform
  # ============================================================
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    command: >
      mlflow server
        --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
        --default-artifact-root s3://mlflow-artifacts/
        --host 0.0.0.0 --port 5000
        --disable-security-middleware
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "5001:5000"
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }

  # ============================================================
  # Dapr
  # ============================================================
  dapr-placement:
    image: "daprio/dapr:1.14.1"
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"

  # ============================================================
  # Application Services (built from repo root for uv workspace)
  # ============================================================
  ingestion:
    build:
      context: .
      dockerfile: source/services/ingestion/Dockerfile
      target: prod
    environment:
      <<: *dapr-env
      SERVICE_NAME: ingestion
      LOG_LEVEL: INFO
    ports:
      - "8001:8000"
      - "3501:3500"  # Dapr HTTP API exposed for host-side scripts (register.py)
    depends_on:
      redpanda: { condition: service_healthy }
      valkey:   { condition: service_healthy }

  preprocessing:
    build:
      context: .
      dockerfile: source/services/preprocessing/Dockerfile
      target: prod
    environment:
      <<: *dapr-env
      SERVICE_NAME: preprocessing
      LOG_LEVEL: INFO
    ports:
      - "8002:8000"
    depends_on:
      redpanda: { condition: service_healthy }
      valkey:   { condition: service_healthy }

  inference:
    build:
      context: .
      dockerfile: source/services/inference/Dockerfile
      target: prod
    environment:
      <<: *dapr-env
      SERVICE_NAME: inference
      LOG_LEVEL: INFO
      MODEL_STORE_PATH: /models
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8003:8000"
    volumes:
      - model-cache:/models
    depends_on:
      redpanda: { condition: service_healthy }
      valkey:   { condition: service_healthy }
      mlflow:   { condition: service_started }

  alert:
    build:
      context: .
      dockerfile: source/services/alert/Dockerfile
      target: prod
    environment:
      <<: *dapr-env
      SERVICE_NAME: alert
      LOG_LEVEL: INFO
    ports:
      - "8004:8000"
    depends_on:
      redpanda: { condition: service_healthy }

  dashboard:
    build:
      context: .
      dockerfile: source/services/dashboard/Dockerfile
      target: prod
    environment:
      <<: *dapr-env
      SERVICE_NAME: dashboard
      LOG_LEVEL: INFO
    ports:
      - "8005:8000"
    depends_on:
      redpanda: { condition: service_healthy }

  # ============================================================
  # Dapr Sidecars
  # ============================================================
  ingestion-dapr:
    image: "daprio/daprd:1.14.1"
    command: ["./daprd",
      "--app-id", "ingestion", "--app-port", "8000",
      "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
      "--resources-path", "/components", "--config", "/config/config.yaml",
      "--placement-host-address", "dapr-placement:50006", "--log-level", "info"]
    volumes:
      - ./dapr/components/local:/components
      - ./dapr:/config
    network_mode: "service:ingestion"
    depends_on: [ingestion, dapr-placement]

  preprocessing-dapr:
    image: "daprio/daprd:1.14.1"
    command: ["./daprd",
      "--app-id", "preprocessing", "--app-port", "8000",
      "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
      "--resources-path", "/components", "--config", "/config/config.yaml",
      "--placement-host-address", "dapr-placement:50006"]
    volumes:
      - ./dapr/components/local:/components
      - ./dapr:/config
    network_mode: "service:preprocessing"
    depends_on: [preprocessing, dapr-placement]

  inference-dapr:
    image: "daprio/daprd:1.14.1"
    command: ["./daprd",
      "--app-id", "inference", "--app-port", "8000",
      "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
      "--resources-path", "/components", "--config", "/config/config.yaml",
      "--placement-host-address", "dapr-placement:50006"]
    volumes:
      - ./dapr/components/local:/components
      - ./dapr:/config
    network_mode: "service:inference"
    depends_on: [inference, dapr-placement]

  alert-dapr:
    image: "daprio/daprd:1.14.1"
    command: ["./daprd",
      "--app-id", "alert", "--app-port", "8000",
      "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
      "--resources-path", "/components", "--config", "/config/config.yaml",
      "--placement-host-address", "dapr-placement:50006"]
    volumes:
      - ./dapr/components/local:/components
      - ./dapr:/config
    network_mode: "service:alert"
    depends_on: [alert, dapr-placement]

  dashboard-dapr:
    image: "daprio/daprd:1.14.1"
    command: ["./daprd",
      "--app-id", "dashboard", "--app-port", "8000",
      "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
      "--resources-path", "/components", "--config", "/config/config.yaml",
      "--placement-host-address", "dapr-placement:50006"]
    volumes:
      - ./dapr/components/dashboard:/components
      - ./dapr:/config
    network_mode: "service:dashboard"
    depends_on: [dashboard, dapr-placement]

  # ============================================================
  # Monitoring (local)
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.54.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  grafana:
    image: grafana/grafana:11.2.0
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
  redpanda-data:
  valkey-data:
  postgres-data:
  minio-data:
  model-cache:
