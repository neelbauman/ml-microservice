name: Build & Push

on:
  push:
    branches: [main]
    paths:
      - "source/services/**"
      - "source/libs/**"
      - "source/ml/**"
      - "pyproject.toml"
      - "uv.lock"

env:
  AWS_REGION: ap-northeast-1

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      training-gpu: ${{ steps.changes.outputs.training-gpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            ingestion:
              - 'source/services/ingestion/**'
              - 'source/libs/common/**'
            preprocessing:
              - 'source/services/preprocessing/**'
              - 'source/libs/common/**'
            inference:
              - 'source/services/inference/**'
              - 'source/libs/common/**'
            alert:
              - 'source/services/alert/**'
              - 'source/libs/common/**'
            dashboard:
              - 'source/services/dashboard/**'
              - 'source/libs/common/**'
            training:
              - 'source/services/training/**'
              - 'source/ml/training/**'
              - 'source/libs/common/**'
            training-gpu:
              - 'source/ml/training/**'
              - 'source/libs/common/**'

      - id: set-matrix
        run: |
          SERVICES=()
          for svc in ingestion preprocessing inference alert dashboard training; do
            if [ "${{ steps.changes.outputs[svc] }}" == "true" ]; then
              SERVICES+=("\"$svc\"")
            fi
          done
          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT
          else
            echo "matrix={\"service\":[$(IFS=,; echo "${SERVICES[*]}")]}" >> $GITHUB_OUTPUT
          fi

  build-services:
    needs: detect-changes
    if: ${{ fromJson(needs.detect-changes.outputs.matrix).service[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: source/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/ml-pipeline-${{ matrix.service }}:latest
            ${{ steps.ecr.outputs.registry }}/ml-pipeline-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-training-gpu:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.training-gpu == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push training GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: source/ml/training/Dockerfile.gpu
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/ml-pipeline-training-gpu:latest
            ${{ steps.ecr.outputs.registry }}/ml-pipeline-training-gpu:${{ github.sha }}
          cache-from: type=gha,scope=training-gpu
          cache-to: type=gha,mode=max,scope=training-gpu
