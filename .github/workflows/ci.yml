name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Run tests
        run: uv run pytest --tb=short --cov --cov-report=xml -q
        env:
          DAPR_HTTP_PORT: "3500"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Lint Helm chart
        run: helm lint helm/

      - name: Template (dev)
        run: helm template ml-pipeline helm/ -f helm/values-dev.yaml --debug > /dev/null

      - name: Template (prod)
        run: helm template ml-pipeline helm/ -f helm/values-prod.yaml --debug > /dev/null

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: Terraform init + validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate
